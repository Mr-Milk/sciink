[package]
name = "sciink"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later"
description = "Fast Inkscape extensions for scientific figures (a Rust rewrite of Scientific-Inkscape)"
repository = "https://github.com/Mr-Milk/sciink"
readme = "README.md"

[lib]
name = "sciink"
path = "src/lib.rs"

[[bin]]
name = "sciink"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
kurbo = "0.13"
quick-xml = "0.42"
svgtypes = "0.16"

[dev-dependencies]
roxmltree = "0.21"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
